<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记丨[[${site.title}]]</title>
  <!--
    canonical：
    - 笔记首页模式下，无筛选的第一页与首页内容重复 → 指向 /
    - 带 ?tag= 或翻页时，声明自身（各自是独立页面，不该被首页吞掉）
  -->
  <th:block
    th:with="canonicalMode=${theme.config.layout.homepage_content ?: 'moments'},
             canonicalTag=${#strings.isEmpty(#strings.toString(param.tag)) ? null : #strings.toString(param.tag)},
             canonicalPage=${moments != null ? moments.page : 1}">
    <link rel="canonical" th:if="${canonicalTag == null and canonicalPage > 1}"
      th:href="@{/moments/page/{p}(p=${canonicalPage})}" />
    <link rel="canonical" th:if="${canonicalTag != null and canonicalPage > 1}"
      th:href="@{/moments/page/{p}(p=${canonicalPage}, tag=${canonicalTag})}" />
    <link rel="canonical" th:if="${canonicalTag != null and canonicalPage <= 1}"
      th:href="@{/moments(tag=${canonicalTag})}" />
    <link rel="canonical" th:if="${canonicalTag == null and canonicalPage <= 1 and canonicalMode == 'moments'}"
      th:href="@{/}" />
    <link rel="canonical" th:if="${canonicalTag == null and canonicalPage <= 1 and canonicalMode != 'moments'}"
      th:href="@{/moments}" />
  </th:block>

  <meta name="description" th:attr="content=${'记录生活中的碎片与灵感 丨 ' + site.title}">
  <!-- 瞬间插件 RSS（/moments/rss.xml） -->
  <link rel="alternate" type="application/rss+xml" th:href="@{/moments/rss.xml}" th:title="${'笔记丨' + site.title}" />
  <!-- 主题防闪烁初始化（必须在最前面） -->
  <th:block th:replace="~{includes/head/theme-init :: theme-init}"></th:block>
  <link rel="stylesheet" th:href="@{/assets/dist/css/main.css}" />
  <!-- 主题配色方案 -->
  <th:block th:replace="~{includes/color-scheme :: color-scheme}"></th:block>
  <link rel="stylesheet" th:href="@{/assets/fonts/caomei/style.css}">
  <script th:src="@{/assets/vendor/dayjs-bundle.min.js}" defer></script>
<!-- 打开搜索弹窗 -->
  <script>
    if (window.location.hash === '#open-search') {
      setTimeout(() => {
        if (window.SearchWidget) SearchWidget.open('');
      }, 100);
    }
  </script>
  <script th:src="@{/assets/dist/js/main.js}" defer></script>
</head>

<body th:attr="data-authenticated=${#authentication.name != 'anonymousUser'}">
  <!-- 插入头部组件 -->
  <div th:replace="includes/components/header :: header"></div>

  <!--
    页面主体容器
    说明：moments / tags 由瞬间插件路由直接注入（/moments、/moments/page/{page}），
         此处不再用 th:with 覆盖，才能拿到正确的 page / totalPages / prevUrl / nextUrl。
         moments  → UrlContextListResult<MomentVo>（插件已按 spec.releaseTime 倒序、按插件设置 pageSize 分页）
         tags     → List<MomentTagVo>（name / permalink / momentCount）
         tagVal   → 当前筛选的标签（来自 ?tag=xxx）
  -->
  <div class="container"
    th:with="allPosts=${postFinder.listAll()},
             stats=${siteStatsFinder.getStats()},
             pluginInstalled=${momentFinder != null},
             momentsForHeatmap=${momentFinder != null ? momentFinder.list(1, 100) : null},
             momentTags=${tags},
             tagVal=${#strings.isEmpty(#strings.toString(param.tag)) ? null : #strings.toString(param.tag)}">

    <!-- 左侧：窄栏（菜单 + 小组件） -->
    <aside class="sidebar" th:style="${theme.config.layout.sidebar_toggle == 'hide' ? 'display:none' : ''}">
      <!-- nav -->
      <div th:replace="includes/components/nav :: nav"></div>
      <!-- author card -->
      <div th:replace="includes/widgets/authorCard :: authorCard(postCount=${allPosts.size()}, stats=${stats})"></div>
    </aside>

    <!-- 右侧：主内容大盒子 -->
    <div class="content">
      <div id="notes" class="notes-layout">
        <main class="notes-core">

          <!-- 插件未安装提示 -->
          <div class="plugin-notice" th:if="${!pluginInstalled}">
            <div class="plugin-notice-icon">📦</div>
            <div class="plugin-notice-content">
              <h3>瞬间插件未安装</h3>
              <p>请安装 <a href="https://www.halo.run/store/apps/app-SnwWD" target="_blank" rel="noopener">瞬间插件</a>
                来展示您的瞬间内容</p>
            </div>
          </div>

          <!-- 插件已安装时显示内容 -->
          <th:block th:if="${pluginInstalled and moments != null}">

            <!-- 发布框（登录 + 插件已安装，由 publisher-slot 统一判断） -->
            <div th:replace="~{includes/components/momentPublisher :: publisher-slot}"></div>

            <div class="notes-tabbar sticky">
              <!-- Tab 链接与高亮统一由公共片段生成（current=moments） -->
              <th:block th:replace="~{includes/components/contentTabs :: content-tabs(mode=${theme.config.layout.homepage_content ?: 'moments'}, current='moments')}"></th:block>
              <!-- 标签筛选提示 -->
              <div class="moment-filter-bar" th:if="${tagVal != null}">
                <span class="moment-filter-tag" th:text="'#' + ${tagVal}"></span>
                <a class="moment-filter-clear" th:href="@{/moments}" title="清除筛选"></a>
              </div>
            </div>

            <!-- 瞬间列表（服务端渲染，SEO 友好） -->
            <div class="article-list" id="articleList">
              <!-- 卡片片段（与首页笔记流共用 includes/widgets/momentCard） -->
              <th:block th:each="moment : ${moments.items}">
                <article th:replace="~{includes/widgets/momentCard :: moment-card(moment=${moment})}"></article>
              </th:block>

              <!-- 无瞬间时的提示 -->
              <div class="empty-moments" th:if="${#lists.isEmpty(moments.items)}">
                <p th:text="${tagVal != null} ? '该标签下暂无笔记' : '暂无笔记'">暂无笔记</p>
              </div>
            </div>

            <!-- 分页：使用插件提供的 totalPages / page，翻页走 /moments/page/{page} -->
            <nav class="pagination moments-pagination" aria-label="笔记分页" th:if="${moments.totalPages > 1}">
              <!-- 上一页（prevUrl 由插件生成，已带 tag 参数） -->
              <a th:if="${moments.hasPrevious()}" th:href="@{${moments.prevUrl}}" class="pagination-previous">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"
                  style="width:1em;height:1em;flex-shrink:0">
                  <path fill-rule="evenodd"
                    d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z"
                    clip-rule="evenodd" />
                </svg>
                上一页
              </a>
              <span th:unless="${moments.hasPrevious()}" class="pagination-previous disabled" aria-disabled="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"
                  style="width:1em;height:1em;flex-shrink:0">
                  <path fill-rule="evenodd"
                    d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z"
                    clip-rule="evenodd" />
                </svg>
                上一页
              </span>

              <div class="pagination-list">
                <!-- 无标签筛选：/moments 与 /moments/page/{n} -->
                <th:block th:if="${tagVal == null}">
                  <th:block th:each="i : ${#numbers.sequence(1, moments.totalPages)}">
                    <a th:if="${i == 1}" th:href="@{/moments}" th:text="${i}"
                      th:class="${i == moments.page} ? 'pagination-page current' : 'pagination-page'"></a>
                    <a th:unless="${i == 1}" th:href="@{/moments/page/{p}(p=${i})}" th:text="${i}"
                      th:class="${i == moments.page} ? 'pagination-page current' : 'pagination-page'"></a>
                  </th:block>
                </th:block>
                <!-- 有标签筛选：保留 ?tag= 参数 -->
                <th:block th:if="${tagVal != null}">
                  <th:block th:each="i : ${#numbers.sequence(1, moments.totalPages)}">
                    <a th:if="${i == 1}" th:href="@{/moments(tag=${tagVal})}" th:text="${i}"
                      th:class="${i == moments.page} ? 'pagination-page current' : 'pagination-page'"></a>
                    <a th:unless="${i == 1}" th:href="@{/moments/page/{p}(p=${i}, tag=${tagVal})}" th:text="${i}"
                      th:class="${i == moments.page} ? 'pagination-page current' : 'pagination-page'"></a>
                  </th:block>
                </th:block>
              </div>

              <!-- 下一页 -->
              <a th:if="${moments.hasNext()}" th:href="@{${moments.nextUrl}}" class="pagination-next">
                下一页
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"
                  style="width:1em;height:1em;flex-shrink:0">
                  <path fill-rule="evenodd"
                    d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z"
                    clip-rule="evenodd" />
                </svg>
              </a>
              <span th:unless="${moments.hasNext()}" class="pagination-next disabled" aria-disabled="true">
                下一页
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"
                  style="width:1em;height:1em;flex-shrink:0">
                  <path fill-rule="evenodd"
                    d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z"
                    clip-rule="evenodd" />
                </svg>
              </span>
            </nav>

            <!-- 单页时保留「加载完毕」提示 -->
            <div class="moments-end-tip" th:if="${moments.totalPages <= 1 and not #lists.isEmpty(moments.items)}">
              <span class="end-line"></span>
              <span class="end-text" th:text="'共 ' + ${moments.total} + ' 条笔记，已全部加载'">已全部加载</span>
              <span class="end-line"></span>
            </div>
          </th:block>
        </main>

        <aside class="notes-aside"
          th:style="${theme.config.layout.right_sidebar_toggle == 'hide' ? 'display:none' : ''}">
          <div class="heatmap-box">
            <div
              th:replace="includes/widgets/heatmap :: heatmap(momentTags=${momentTags}, momentsForHeatmap=${momentsForHeatmap})">
            </div>
          </div>
          <div class="topic-box">
            <div th:replace="includes/widgets/topicList :: moment-tags(${momentTags}, ${moments})"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- 页脚部分 -->
  <div th:replace="includes/components/footer :: footer"></div>

  <!-- Tab 栏配套弹窗（瞬间插件未安装提示） -->
  <div th:replace="~{includes/components/contentTabs :: content-tabs-notices}"></div>

  <!-- 全局弹窗（灯箱 / 视频 / 确认框，公共片段） -->
  <div th:replace="~{includes/scripts/moment-overlays :: moment-overlays}"></div>

<div th:replace="~{includes/scripts/moment-scripts :: moment-scripts}"></div>

</body>

</html>
