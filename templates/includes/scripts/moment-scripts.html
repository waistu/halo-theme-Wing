<!--
  =============================================
  瞬间插件 - 前端交互脚本（公共片段）
  =============================================
  被 moments.html（列表路由 /moments）与 moment.html（详情路由 /moments/{name}）共同引用：
    <div th:replace="~{includes/scripts/moment-scripts :: moment-scripts}"></div>

  包含能力：
    - 图片灯箱（多图切换 / 键盘导航）
    - 视频：竖屏检测 + 弹窗播放
    - 点赞（localStorage 记忆 + trackers/upvote API）
    - 更多菜单 / 删除 / 可见性切换 / 原位编辑
    - 正文 #话题 转可点击链接（指向 ?tag=）
    - 自定义确认弹窗
  =============================================
-->
<th:block th:fragment="moment-scripts">
  <!-- 服务端数据透传（含 context path，避免子目录部署时链接错位） -->
  <div id="wingMomentsConfig" hidden
    th:attr="data-base=@{/moments},
             data-logged-in=${#authentication.name != 'anonymousUser' ? '1' : '0'}"></div>

  <!-- 交互脚本外置为可缓存的独立文件（源码 src/js/moments.js，构建产物 dist/js/moments.js） -->
  <script th:src="@{/assets/dist/js/moments.js}" defer></script>
</th:block>
