<!--
  =============================================
  标签组件 - 瞬间标签和文章标签
  =============================================
  moment-tags(momentTags, moments)
    momentTags → List<MomentTagVo>，含 name / permalink / momentCount（由插件路由注入，首选）
    moments    → ListResult<MomentVo>，momentTags 为空时退化为从瞬间数据里统计
  =============================================
-->

<!-- 瞬间标签 -->
<div th:fragment="moment-tags(momentTags, moments)" class="topic-card"
    style="padding: 0 var(--spacing-5); margin-top: var(--spacing-4);">
    <th:block th:if="${momentTags != null}">
        <div class="topic-list" th:unless="${#lists.isEmpty(momentTags)}">
            <ul class="topic-items"
                style="border-left: 1px solid var(--border-color); padding-left: var(--spacing-2\.5);">
                <li class="topic-item" th:each="tag : ${momentTags}" th:attr="data-count=${tag.momentCount}">
                    <!-- 用 @{} 生成，兼容子目录部署与 URL 编码（插件 permalink 写死了 /moments） -->
                    <a th:href="@{/moments(tag=${tag.name})}" th:text="${tag.name}"></a>
                    <span class="topic-count" th:text="${tag.momentCount}">0</span>
                </li>
            </ul>
        </div>
        <div class="topic-empty" th:if="${#lists.isEmpty(momentTags)}">暂无标签</div>
    </th:block>

    <!-- 退化路径：详情页路由不注入 tags，从最近瞬间里统计（数量为近似值） -->
    <th:block th:unless="${momentTags != null}">
        <th:block th:if="${moments != null and not #lists.isEmpty(moments.items)}">
            <div class="topic-list">
                <ul class="topic-items" th:id="momentTagsFromData" th:attr="data-base=@{/moments}"
                    style="border-left: 1px solid var(--border-color); padding-left: var(--spacing-2\.5);">
                    <th:block th:each="moment : ${moments.items}">
                        <th:block th:if="${moment.spec.tags != null and not #lists.isEmpty(moment.spec.tags)}">
                            <th:block th:each="tagName : ${moment.spec.tags}">
                                <li class="topic-item __hm_tag_raw" th:attr="data-tag=${tagName}" style="display:none">
                                    <span th:text="${tagName}"></span>
                                </li>
                            </th:block>
                        </th:block>
                    </th:block>
                </ul>
            </div>
            <script>
                (function () {
                    var ul = document.getElementById('momentTagsFromData');
                    if (!ul) return;
                    var base = ul.getAttribute('data-base') || '/moments';
                    var counts = {};

                    ul.querySelectorAll('.__hm_tag_raw').forEach(function (el) {
                        var t = el.dataset.tag;
                        if (!t) return;
                        counts[t] = (counts[t] || 0) + 1;
                        el.remove();
                    });

                    var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
                    if (!names.length) {
                        var empty = document.createElement('div');
                        empty.className = 'topic-empty';
                        empty.textContent = '暂无标签';
                        ul.closest('.topic-list').replaceWith(empty);
                        return;
                    }

                    names.forEach(function (name) {
                        var li = document.createElement('li');
                        li.className = 'topic-item';
                        li.setAttribute('data-count', counts[name]);

                        var a = document.createElement('a');
                        a.href = base + '?tag=' + encodeURIComponent(name);
                        a.textContent = name;

                        var count = document.createElement('span');
                        count.className = 'topic-count';
                        count.textContent = counts[name];

                        li.appendChild(a);
                        li.appendChild(count);
                        ul.appendChild(li);
                    });
                })();
            </script>
        </th:block>
        <th:block th:unless="${moments != null and not #lists.isEmpty(moments.items)}">
            <div class="topic-empty">暂无标签</div>
        </th:block>
    </th:block>
</div>

<!-- 文章标签 -->
<div th:fragment="post-tags" class="topic-card" style="padding: 0 var(--spacing-5); margin-top: var(--spacing-4);">
    <th:block th:with="tags = ${tagFinder.listAll()}">
        <div class="topic-list" th:unless="${#lists.isEmpty(tags)}">
            <ul class="topic-items"
                style="border-left: 1px solid var(--border-color); padding-left: var(--spacing-2\.5);">
                <li class="topic-item" th:each="tag : ${tags}" th:attr="data-count=${tag.postCount}">
                    <a th:href="${tag.status.permalink}" th:text="${tag.spec.displayName}"></a>
                    <span class="topic-count" th:text="${tag.postCount}">0</span>
                </li>
            </ul>
        </div>
        <div class="topic-empty" th:if="${#lists.isEmpty(tags)}">暂无标签</div>
    </th:block>
</div>
