<!-- 底部公共文件 → 被 th:replace 引用 -->
<div th:fragment="footer" class="footer --bg-page dark:--bg-page-dark text-gray-600 dark:text-gray-400" id="footer">
    <!-- 回到顶部：滚动超过一屏后出现在视口右侧 -->
    <button type="button" class="wing-to-top" id="wingToTop" aria-label="回到顶部" title="回到顶部">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd"
                d="M8 2.5a.75.75 0 0 1 .53.22l4.25 4.25a.75.75 0 1 1-1.06 1.06L8.75 5.06V13a.75.75 0 0 1-1.5 0V5.06L4.28 8.03a.75.75 0 0 1-1.06-1.06l4.25-4.25A.75.75 0 0 1 8 2.5Z"
                clip-rule="evenodd" />
        </svg>
    </button>

<div th:fragment="footer" class="footer --bg-page dark:--bg-page-dark text-gray-600 dark:text-gray-400" id="footer">
    <div class="footer-container">
        <!-- 左侧：版权 + 网站标题 -->
        <div class="footer-left">
            <span>© 2026 <strong><a th:href="@{/}"
                        class="text-gray-900 dark:text-white hover:text-rose-500 dark:hover:text-rose-400"
                        th:text="${site.title != null ? site.title : '我的网站'}"></a></strong></span>

            <!-- 只有用户设置了备案号才显示 -->
            <th:block th:if="${theme.config.basic.icp != null and theme.config.basic.icp != ''}">
                <a href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank"
                    class="text-gray-500 dark:text-gray-400 hover:text-rose-500 dark:hover:text-rose-300">
                    <span class="icp" th:text="${theme.config.basic.icp}"></span>
                </a>
            </th:block>
        </div>

        <!-- 右侧：主题标识 -->
        <div class="footer-right">
            <span class="powered-by">
                Powered by <a href="https://www.halo.run" target="_blank"
                    class="text-rose-500 dark:text-rose-400 hover:underline">Halo</a>
            </span>
            <span class="theme-by">Theme by <a href="https://github.com/waistu/halo-theme-Wing"
                    class="theme-by-wing text-rose-500 dark:text-rose-400 hover:underline" target="_blank"
                    rel="noopener noreferrer">
                    <span>Wing</span>
                    <span class="rainbow-bar"></span>
                </a></span>

        </div>
    </div>
    <!-- Halo / 插件注入点：设置与插件通过它追加脚本、样式、统计代码 -->
    <halo:footer />
</div>
