<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友链丨[[${site.title}]]</title>
    <!-- 主题防闪烁初始化（必须在最前面） -->
    <th:block th:replace="~{includes/head/theme-init :: theme-init}"></th:block>
    <link rel="stylesheet" th:href="@{/assets/dist/css/main.css}" />
    <!-- 主题配色方案 -->
    <th:block th:replace="~{includes/color-scheme :: color-scheme}"></th:block>
    <link rel="stylesheet" th:href="@{/assets/fonts/caomei/style.css}">
    <!-- 主题配置透传给 main.js -->
    <script th:inline="javascript">
        window.__WING_THEME__ = {
            serverMode: /*[[${theme.config.style?.theme_mode ?: 'auto'}]]*/ 'auto',
            lightStart: /*[[${theme.config.style?.auto_theme_time?.light_start ?: '06:00'}]]*/ '06:00',
            darkStart: /*[[${theme.config.style?.auto_theme_time?.dark_start ?: '22:00'}]]*/ '22:00'
        };
    </script>
  <script th:src="@{/assets/vendor/dayjs-bundle.min.js}" defer></script>
<!-- 打开搜索弹窗 -->
    <script>
        if (window.location.hash === '#open-search') {
            setTimeout(() => {
                if (window.SearchWidget) SearchWidget.open('');
            }, 100);
        }
    </script>
    <script th:src="@{/assets/dist/js/main.js}" defer></script>
</head>

<body>
    <!-- Meteor 流星背景（仅深色模式生效） -->
    <!-- 插入头部组件 -->
    <div th:replace="includes/components/header :: header"></div>
    <!-- 页面主体容器 -->
    <div class="container"
        th:with="allPosts=${postFinder.listAll()}, stats=${siteStatsFinder.getStats()}, momentsForHeatmap=${momentFinder != null ? momentFinder.list(1, 100) : null}, linkGroups=${linkFinder.groupBy()}">
        <!-- 左侧：窄栏（菜单 + 小组件） -->
        <aside class="sidebar" th:style="${theme.config.layout.sidebar_toggle == 'hide' ? 'display:none' : ''}">
            <!-- nav -->
            <div th:replace="includes/components/nav :: nav"></div>
            <!-- author card -->
            <div th:replace="includes/widgets/authorCard :: authorCard(postCount=${allPosts.size()}, stats=${stats})">
            </div>
        </aside>
        <!-- 右侧：主内容大盒子 -->
        <div class="content">
            <div id="notes" class="notes-layout">
                <main class="notes-core full-width">
                    <div class="page-header">
                        <div class="flex items-center justify-between">
                            <h1 class="page-title">友链</h1>
                            <!-- HeroUI 风格按钮：申请友链 -->
                            <th:block th:with="linkApplyEnabled=${linkApplicationEnabled != null ? linkApplicationEnabled : (linkFinder != null)}">
                                <a href="javascript:void(0)" class="link-apply-btn-solid" id="link-apply-btn" th:if="${linkApplyEnabled}">
                                    <span>申请友链</span>
                                    <i class="czs czs-add"></i>
                                </a>
                                <a th:unless="${linkApplyEnabled}"
                                    href="mailto:[[${site.owner?.email ?: ''}]]?subject=友链申请"
                                    class="link-apply-btn-solid">
                                    <span>申请友链</span>
                                    <i class="czs czs-add"></i>
                                </a>
                            </th:block>
                        </div>
                        <p class="page-description mt-2">交换友链请联系博主</p>
                    </div>
                    <!-- 友链列表区域 -->
                    <div class="links-list" th:if="${#lists.isEmpty(linkGroups)}">
                        <div class="empty-state">
                            <p>暂无友链</p>
                        </div>
                    </div>
                    <!-- 友链分组列表 -->
                    <th:block th:each="group : ${linkGroups}">
                        <th:block th:with="groupStyle=${group.metadata.annotations['theme-wing/link-group-style']}">
                            <div class="link-group" th:if="${not #lists.isEmpty(group.links)}">
                                <h2 class="link-group-title" th:text="${group.spec.displayName}">分组名称</h2>
                                <div class="link-items">
                                    <a th:each="link : ${group.links}" th:href="${link.spec.url}"
                                        th:title="${link.spec.displayName}" class="link-item"
                                        th:classappend="${groupStyle == 'recommend' ? ' style-recommend' : (groupStyle == 'lost' ? ' style-lost' : '')}"
                                        target="_blank" rel="noopener noreferrer">
                                        <div class="link-logo">
                                            <img th:src="${link.spec.logo}" th:alt="${link.spec.displayName}"
                                                th:onerror="|this.src='@{/assets/images/author-avatar.webp}'|" />
                                        </div>
                                        <div class="link-info">
                                            <h3 class="link-name" th:text="${link.spec.displayName}">网站名称</h3>
                                            <p class="link-desc" th:text="${link.spec.description}">网站描述</p>
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </th:block>

                    </th:block>
                    <!-- 折叠信息区域 -->
                    <th:block th:if="${not #lists.isEmpty(theme.config.links?.link_accordions)}">
                        <div class="link-accordions">
                            <div th:each="item, iterStat : ${theme.config.links.link_accordions}" class="accordion-item"
                                th:class="'accordion-item' + (${item.expanded} ? ' expanded' : '')">
                                <div class="accordion-header" th:data-index="${iterStat.index}">
                                    <div class="accordion-title-wrapper">
                                        <h3 class="accordion-title" th:text="${item.title}">标题</h3>
                                        <p class="accordion-subtitle" th:if="${item.subtitle}"
                                            th:text="${item.subtitle}">副标题</p>
                                    </div>
                                    <div class="accordion-indicator">
                                        <i class="czs czs-angle-down"></i>
                                    </div>
                                </div>
                                <div class="accordion-content">
                                    <div class="accordion-body" th:utext="${item.content}">内容</div>
                                </div>
                            </div>
                        </div>
                    </th:block>
                    <!-- 评论区 -->
                    <th:block
                        th:if="${theme.config.links?.enable_comment == true and pluginFinder.available('PluginCommentWidget')}">
                        <th:block th:with="commentProvider=${theme.config.comment?.comment_provider}">
                            <div class="comments-section">
                                <div class="comments-header"
                                    style="display: flex; justify-content: space-between; align-items: center;">
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <i class="czs czs-comment-l"></i>
                                        <span class="comments-title">评论</span>
                                    </div>
                                    <div style="display: flex; gap: 16px;">
                                        <th:block
                                            th:if="${commentProvider == 'twikoo' and theme.config.comment?.anonymous_comment == true}">
                                            <a href="javascript:void(0)" class="anonymous-comment-btn"
                                                th:data-email="${theme.config.comment?.anonymous_config?.anonymous_email}"
                                                th:data-nickname="${theme.config.comment?.anonymous_config?.anonymous_nickname}">匿名评论</a>
                                        </th:block>
                                        <th:block th:if="${theme.config.comment?.privacy_policy_url}">
                                            <a th:href="${theme.config.comment.privacy_policy_url}"
                                                target="_blank">隐私协议</a>
                                        </th:block>
                                    </div>
                                </div>
                                <!-- Twikoo 评论 -->
                                <th:block th:if="${commentProvider == 'twikoo'}">
                                    <div th:replace="~{includes/comment/twikoo :: twikoo}"></div>
                                </th:block>
                                <!-- Halo 官方评论 -->
                                <th:block th:unless="${commentProvider == 'twikoo'}">
                                    <div class="article-comment round">
                                        <halo:comment group="plugin.halo.run" kind="Plugin"
                                            th:attr="name=${pluginName}" />
                                    </div>
                                </th:block>
                            </div>
                        </th:block>
                    </th:block>
                </main>
            </div>
        </div>
    </div>
    <!-- 页脚部分 -->
    <div th:replace="includes/components/footer :: footer"></div>
    <!-- 友链申请弹窗 -->
    <div class="link-apply-modal" id="link-apply-modal" style="display:none">
        <div class="link-apply-backdrop" data-close></div>
        <div class="link-apply-dialog">
            <button class="link-apply-close" data-close aria-label="关闭">
                <i class="czs czs-close-l"></i>
            </button>
            <div class="link-apply-header">
                <h2 class="link-apply-title">申请友链</h2>
                <p class="link-apply-desc">填写下方信息，提交后等待博主审核</p>
            </div>
            <form class="link-apply-form" id="link-apply-form">
                <div class="form-group">
                    <label class="form-label" for="la-url">网站地址 <span class="required">*</span></label>
                    <input class="form-input" type="url" id="la-url" name="url" required
                        placeholder="https://example.com" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="la-name">网站名称 <span class="required">*</span></label>
                    <input class="form-input" type="text" id="la-name" name="displayName" required
                        placeholder="网站名称" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="la-logo">Logo 地址</label>
                    <input class="form-input" type="url" id="la-logo" name="logo"
                        placeholder="https://example.com/logo.png" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="la-desc">网站描述</label>
                    <textarea class="form-textarea" id="la-desc" name="description" rows="2"
                        placeholder="一句话描述你的网站"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="la-email">联系邮箱</label>
                    <input class="form-input" type="email" id="la-email" name="email"
                        placeholder="your@email.com" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="la-captcha">验证码 <span class="required">*</span></label>
                    <div class="captcha-row">
                        <input class="form-input" type="text" id="la-captcha" name="captchaCode" required
                            placeholder="输入验证码" autocomplete="off" />
                        <img class="captcha-img" id="la-captcha-img" alt="点击刷新验证码"
                            title="点击刷新验证码" />
                    </div>
                </div>
                <div class="form-message" id="la-message" style="display:none"></div>
                <button class="link-apply-submit" type="submit" id="la-submit">
                    <span class="submit-text">提交申请</span>
                    <span class="submit-loading" style="display:none">
                        <span class="spinner"></span> 提交中...
                    </span>
                </button>
            </form>
        </div>
    </div>
    <script>
        (function () {
            var path = window.location.pathname;
            var tabs = document.querySelectorAll('.notes-tabbar .tab-item');
            tabs.forEach(function (tab) {
                var link = tab.querySelector('a');
                if (!link) return;
                var href = link.getAttribute('href');
                if (!href) return;

                // 首页
                if (path === '/' || path === '' || path === '/index' || path === '/index.html') {
                    if (href === '/' || href.endsWith('/')) {
                        tab.classList.add('active');
                    }
                }
                // 笔记页面
                else if (path.startsWith('/moments')) {
                    if (href === '/moments') {
                        tab.classList.add('active');
                    }
                }
            });
        })();
    </script>
    <!-- Markdown 解析器 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <!-- Accordion 折叠组件脚本 -->
    <script>
        (function () {
            // 渲染 Markdown 内容
            var bodies = document.querySelectorAll('.accordion-body');
            bodies.forEach(function (body) {
                var rawContent = body.textContent || body.innerText || '';
                if (rawContent && typeof marked !== 'undefined') {
                    body.innerHTML = marked.parse(rawContent);
                }
            });

            // 折叠交互
            var accordions = document.querySelectorAll('.accordion-item');
            accordions.forEach(function (accordion) {
                var header = accordion.querySelector('.accordion-header');
                if (!header) return;

                header.addEventListener('click', function () {
                    var isExpanded = accordion.classList.contains('expanded');

                    // 切换当前项状态
                    if (isExpanded) {
                        accordion.classList.remove('expanded');
                    } else {
                        accordion.classList.add('expanded');
                    }
                });
            });
        })();
    </script>
    <!-- 友链申请弹窗 JS -->
    <script th:inline="javascript">
        (function () {
            var modal = document.getElementById('link-apply-modal');
            var btn = document.getElementById('link-apply-btn');
            var form = document.getElementById('link-apply-form');
            var captchaImg = document.getElementById('la-captcha-img');
            var messageEl = document.getElementById('la-message');
            var submitBtn = document.getElementById('la-submit');
            var challengeId = null;

            var API_CAPTCHA = '/apis/api.link.halo.run/v1alpha1/link-applications/captcha';
            var API_SUBMIT = '/apis/api.link.halo.run/v1alpha1/link-applications';

            if (!btn || !modal) return;

            // 打开弹窗
            function openModal() {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                fetchCaptcha();
            }

            // 关闭弹窗
            function closeModal() {
                modal.style.display = 'none';
                document.body.style.overflow = '';
                hideMessage();
                form.reset();
            }

            // 获取验证码
            function fetchCaptcha() {
                captchaImg.style.opacity = '0.3';
                fetch(API_CAPTCHA, { method: 'POST' })
                    .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function (data) {
                        challengeId = data.challengeId;
                        captchaImg.src = data.image;
                        captchaImg.style.opacity = '1';
                    })
                    .catch(function () {
                        captchaImg.src = '';
                        captchaImg.alt = '验证码获取失败，点击重试';
                        captchaImg.style.opacity = '1';
                    });
            }

            // 显示消息
            function showMessage(type, text) {
                messageEl.style.display = 'block';
                messageEl.className = 'form-message ' + type;
                messageEl.textContent = text;
            }

            function hideMessage() {
                messageEl.style.display = 'none';
                messageEl.textContent = '';
            }

            // 提交申请
            function submitApplication(payload) {
                submitBtn.disabled = true;
                submitBtn.querySelector('.submit-text').style.display = 'none';
                submitBtn.querySelector('.submit-loading').style.display = 'inline-flex';

                fetch(API_SUBMIT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                    .then(function (res) {
                        if (res.status === 201) {
                            return res.json().then(function () {
                                showMessage('success', '申请提交成功！请等待博主审核。');
                                form.reset();
                                setTimeout(closeModal, 2000);
                            });
                        }
                        return res.json().then(function (err) {
                            var type = err.type || '';
                            var msg = err.detail || err.title || '提交失败';
                            if (type.includes('captcha')) {
                                showMessage('error', '验证码错误或已过期，请重新输入');
                                fetchCaptcha();
                            } else if (type.includes('duplicate')) {
                                showMessage('error', '该网站已经申请过友链了');
                            } else if (type.includes('disabled')) {
                                showMessage('error', '友链申请暂未开放');
                            } else if (type.includes('capacity')) {
                                showMessage('error', '待审核申请已满，请稍后再试');
                            } else if (type.includes('not-permitted') || res.status === 429) {
                                showMessage('error', '提交过于频繁，请稍后再试');
                            } else if (type.includes('unavailable')) {
                                showMessage('error', '服务暂时不可用，请稍后再试');
                            } else {
                                showMessage('error', msg);
                            }
                        });
                    })
                    .catch(function () {
                        showMessage('error', '网络错误，请稍后重试');
                    })
                    .finally(function () {
                        submitBtn.disabled = false;
                        submitBtn.querySelector('.submit-text').style.display = 'inline';
                        submitBtn.querySelector('.submit-loading').style.display = 'none';
                    });
            }

            // 事件绑定
            btn.addEventListener('click', openModal);

            modal.querySelectorAll('[data-close]').forEach(function (el) {
                el.addEventListener('click', closeModal);
            });

            captchaImg.addEventListener('click', fetchCaptcha);

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                hideMessage();

                if (!challengeId) {
                    showMessage('error', '请先获取验证码');
                    fetchCaptcha();
                    return;
                }

                var payload = {
                    url: form.url.value.trim(),
                    displayName: form.displayName.value.trim(),
                    captchaCode: form.captchaCode.value.trim(),
                    challengeId: challengeId
                };

                if (form.logo.value.trim()) payload.logo = form.logo.value.trim();
                if (form.description.value.trim()) payload.description = form.description.value.trim();
                if (form.email.value.trim()) payload.email = form.email.value.trim();

                submitApplication(payload);
            });

            // ESC 关闭
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modal.style.display === 'flex') closeModal();
            });
        })();
    </script>
    <!-- 匿名评论功能 -->
    <script th:inline="javascript">
        (function () {
            var anonymousBtn = document.getElementById('anonymous-comment-btn');
            if (!anonymousBtn) return;

            var email = anonymousBtn.getAttribute('data-email');
            var nickname = anonymousBtn.getAttribute('data-nickname');

            if (!email || !nickname) return;

            anonymousBtn.addEventListener('click', function () {
                // 等待评论组件加载完成
                var fillAnonymous = function () {
                    // 查找所有可能的输入框
                    var allInputs = document.querySelectorAll('input[type="text"], input[type="email"], input:not([type])');
                    var emailInput = null;
                    var nickInput = null;

                    allInputs.forEach(function (input) {
                        var placeholder = (input.placeholder || '').toLowerCase();
                        var name = (input.name || '').toLowerCase();

                        // 通过 placeholder 或 name 判断
                        if (!emailInput && (placeholder.includes('邮') || name.includes('mail') || name.includes('email'))) {
                            emailInput = input;
                        }
                        if (!nickInput && (placeholder.includes('昵') || placeholder.includes('名') || placeholder.includes('作者') || name.includes('nick') || name.includes('author') || name.includes('name'))) {
                            nickInput = input;
                        }
                    });

                    if (emailInput) {
                        emailInput.value = email;
                        emailInput.dispatchEvent(new Event('input', { bubbles: true }));
                        emailInput.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                    if (nickInput) {
                        nickInput.value = nickname;
                        nickInput.dispatchEvent(new Event('input', { bubbles: true }));
                        nickInput.dispatchEvent(new Event('change', { bubbles: true }));
                    }

                    // 如果还没找到，短暂重试
                    if ((!emailInput || !nickInput) && window.commentWidget) {
                        setTimeout(fillAnonymous, 500);
                    }
                };

                fillAnonymous();
            });
        })();
    </script>
    <!-- Meteor 流星背景 JS -->
</body>

</html>
