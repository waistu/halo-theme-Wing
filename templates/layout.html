<!DOCTYPE html>
<!--
  ============================================================
  页面布局契约（Halo 2.26.0+）
  ============================================================
  插件提供的前台页面通过 ~{layout :: html(head = ~{::head}, content = ~{::content})}
  复用本主题的页头、侧栏、页脚、配色与响应式外壳。

  契约要求（Halo 静态校验的正则）：
    th:fragment="html (head, content)"
  - head    : 调用方提供的 <head> 片段；调用方会自带 <title>
  - content : 调用方提供的正文片段

  注意：
  1. head 为空时才输出站点标题，避免同页出现两个 <title>
  2. 主题自己的页面不强制走这里（仍各自 `th:replace` 片段），
     本文件只服务插件前台页面，改动它不会影响主题现有页面
  3. 底部保留 <halo:footer />，Halo 与插件需要它注入脚本/样式
  4. 主题配置项用 theme.config 读取，与主题页面保持一致；
     finder 全部做 null 保护，插件页面上下文缺少变量时不会炸
  ============================================================
-->
<html lang="zh-CN" class="scroll-smooth" xmlns:th="https://www.thymeleaf.org"
  th:fragment="html (head, content)">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 调用方未提供 head 时才兜底站点标题，避免重复 <title> -->
  <title th:if="${head == null}" th:text="${site.title}"></title>

  <!-- 主题防闪烁初始化（必须在最前面） -->
  <th:block th:replace="~{includes/head/theme-init :: theme-init}"></th:block>
  <link rel="stylesheet" th:href="@{/assets/dist/css/main.css}" />
  <link rel="stylesheet" th:href="@{/assets/vendor/magic-ui/meteors.css}"
    th:if="${theme.config.style.meteors_enabled != 'disabled'}" />
  <!-- 主题配色方案 -->
  <th:block th:replace="~{includes/color-scheme :: color-scheme}"></th:block>
  <link rel="stylesheet" th:href="@{/assets/fonts/caomei/style.css}">
  <script th:src="@{/assets/vendor/dayjs-bundle.min.js}" defer></script>
<!-- 主题配置透传给 main.js -->
  <script th:inline="javascript">
    window.__WING_THEME__ = {
      serverMode: /*[[${theme.config.style?.theme_mode ?: 'auto'}]]*/ 'auto',
      lightStart: /*[[${theme.config.style?.auto_theme_time?.light_start ?: '06:00'}]]*/ '06:00',
      darkStart: /*[[${theme.config.style?.auto_theme_time?.dark_start ?: '22:00'}]]*/ '22:00'
    };
  </script>
  <script th:src="@{/assets/dist/js/main.js}" defer></script>
  <script th:src="@{/assets/vendor/magic-ui/meteors.js}"
    th:if="${theme.config.style.meteors_enabled != 'disabled'}"></script>

  <!-- 调用方提供的头部片段（通常含 <title> / meta / 页面资源） -->
  <th:block th:if="${head != null}">
    <th:block th:replace="${head}" />
  </th:block>
</head>

<body data-meteors data-meteor-count="40" data-meteor-min-delay="0.1" data-meteor-max-delay="0.8"
  th:attr="data-authenticated=${#authentication.name != 'anonymousUser'}">
  <!-- 头部组件 -->
  <div th:replace="~{includes/components/header :: header}"></div>

  <!-- 主体：侧边栏 + 插件页面内容 -->
  <div class="container"
    th:with="wingStats=${siteStatsFinder != null ? siteStatsFinder.getStats() : null},
             wingPostCount=${postFinder != null ? postFinder.listAll().size() : 0}">
    <aside class="sidebar" data-sidebar
      th:style="${theme.config.layout.sidebar_toggle == 'hide' ? 'display:none' : ''}">
      <div th:replace="~{includes/components/nav :: nav}"></div>
      <div
        th:replace="~{includes/widgets/authorCard :: authorCard(postCount=${wingPostCount}, stats=${wingStats})}">
      </div>
    </aside>

    <!-- 右侧：主内容大盒子，插件页面正文注入到这里 -->
    <div class="content">
      <div class="wing-plugin-page">
        <th:block th:replace="${content}" />
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <div th:replace="~{includes/components/footer :: footer}"></div>

  <!-- Halo / 插件注入点（脚本、样式、统计等） -->
  <halo:footer />
</body>

</html>
