<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${site.title}"></title>
  <!--
    canonical：首页是这几类列表里唯一权威的地址
    - 带 ?tag= 的筛选页声明自身，避免被当成首页副本
    - 文章首页模式的第 2 页起，与 /page/{n} 一一对应
    - 其余（笔记首页模式、文章首页第 1 页）都归一到 /
  -->
  <th:block
    th:with="canonicalMode=${theme.config.layout.homepage_content ?: 'moments'},
             canonicalTag=${#strings.isEmpty(#strings.toString(param.tag)) ? null : #strings.toString(param.tag)},
             canonicalPage=${posts != null ? posts.page : 1}">
    <link rel="canonical" th:if="${canonicalTag != null}" th:href="@{/(tag=${canonicalTag})}" />
    <link rel="canonical" th:if="${canonicalTag == null and canonicalMode != 'moments' and canonicalPage > 1}"
      th:href="@{/page/{p}(p=${canonicalPage})}" />
    <link rel="canonical"
      th:if="${canonicalTag == null and (canonicalMode == 'moments' or canonicalPage <= 1)}" th:href="@{/}" />
  </th:block>

  <!-- 主题防闪烁初始化（必须在最前面） -->
  <th:block th:replace="~{includes/head/theme-init :: theme-init}"></th:block>
  <link rel="stylesheet" th:href="@{/assets/vendor/normalize.css}" />
  <link rel="stylesheet" th:href="@{/assets/dist/css/main.css}" />
  <link rel="stylesheet" th:href="@{/assets/vendor/magic-ui/meteors.css}" th:if="${theme.config.style.meteors_enabled != 'disabled'}" />
  <!-- 主题配色方案 -->
  <th:block th:replace="~{includes/color-scheme :: color-scheme}"></th:block>
  <link rel="stylesheet" th:href="@{/assets/fonts/caomei/style.css}">
  <script th:src="@{/assets/vendor/dayjs.min.js}"></script>
  <script th:src="@{/assets/vendor/relativeTime.js}"></script>
  <script th:src="@{/assets/vendor/zh-cn.js}"></script>
  <!-- 打开搜索弹窗 -->
  <script>
    if (window.location.hash === '#open-search') {
      setTimeout(() => {
        if (window.SearchWidget) SearchWidget.open('');
      }, 100);
    }
  </script>
  <script th:src="@{/assets/dist/js/main.js}"></script>
  <script th:src="@{/assets/vendor/magic-ui/meteors.js}" th:if="${theme.config.style.meteors_enabled != 'disabled'}"></script>
</head>

<body data-meteors data-meteor-count="40" data-meteor-min-delay="0.1" data-meteor-max-delay="0.8"
  th:attr="data-authenticated=${#authentication.name != 'anonymousUser'}">
  <!-- 插入头部组件 -->
  <div th:replace="includes/components/header :: header"></div>
  <!-- 页面主体容器 -->
  <!-- homepageMode: moments=笔记首页（默认），posts=文章首页 -->
  <div class="container"
    th:with="homepageMode=${theme.config.layout.homepage_content ?: 'moments'},
             postsSlug=${theme.config.layout.posts_page_slug ?: 'posts'},
             allPosts=${postFinder.listAll()},
             stats=${siteStatsFinder.getStats()},
             hasPosts=${posts != null and !posts.items.isEmpty()},
             defaultCover=${theme.config.style?.default_cover},
             tagParam=${#strings.isEmpty(#strings.toString(param.tag)) ? null : #strings.toString(param.tag)},
             momentsForHeatmap=${momentFinder != null ? momentFinder.list(1, 100) : null},
             momentTags=${momentFinder != null ? momentFinder.listAllTags() : null},
             moments=${momentFinder != null ? (tagParam != null ? momentFinder.listByTag(1, 20, tagParam) : momentFinder.list(1, 20)) : null}">
    <!-- 左侧：窄栏（菜单 + 小组件） -->
    <aside class="sidebar" th:style="${theme.config.layout.sidebar_toggle == 'hide' ? 'display:none' : ''}"
      data-sidebar>
      <!-- nav -->
      <div th:replace="includes/components/nav :: nav"></div>
      <!-- author card -->
      <div th:replace="includes/widgets/authorCard :: authorCard(postCount=${allPosts.size()}, stats=${stats})"></div>
    </aside>
    <!-- 右侧：主内容大盒子 -->
    <div class="content">
      <div id="notes" class="notes-layout">
        <main class="notes-core">

          <!-- ===== 发布框（登录 + 插件已安装，由 publisher-slot 统一判断）===== -->
          <div th:replace="~{includes/components/momentPublisher :: publisher-slot}"></div>

          <!-- ===== Tab 栏：链接与高亮统一由公共片段生成 ===== -->
          <div class="notes-tabbar sticky">
            <th:block th:replace="~{includes/components/contentTabs :: content-tabs(mode=${homepageMode}, current='home')}"></th:block>
            <!-- 标签筛选提示（笔记首页模式下） -->
            <div class="moment-filter-bar" th:if="${homepageMode == 'moments' and tagParam != null}">
              <span class="moment-filter-tag" th:text="${tagParam}"></span>
              <a class="moment-filter-clear" th:href="@{/}"></a>
            </div>
          </div>

          <!-- ===== 内容区：笔记首页模式 ===== -->
          <th:block th:if="${homepageMode == 'moments'}">
            <!-- 插件未安装提示 -->
            <div class="plugin-notice" th:if="${momentFinder == null}">
              <div class="plugin-notice-icon">📦</div>
              <div class="plugin-notice-content">
                <h3>瞬间插件未安装</h3>
                <p>请安装 <a href="https://www.halo.run/store/apps/app-SnwWD" target="_blank" rel="noopener">瞬间插件</a>
                  来展示笔记内容</p>
              </div>
            </div>

            <!-- 已安装：服务端渲染首屏笔记（20 条），超出部分引导到 /moments 列表页 -->
            <th:block th:if="${momentFinder != null and moments != null}">
              <div class="article-list" id="articleList">
                <th:block th:each="moment : ${moments.items}">
                  <article th:replace="~{includes/widgets/momentCard :: moment-card(moment=${moment})}"></article>
                </th:block>

                <div class="empty-moments" th:if="${#lists.isEmpty(moments.items)}">
                  <p th:text="${tagParam != null} ? '该标签下暂无笔记' : '暂无笔记'">暂无笔记</p>
                </div>
              </div>

              <!-- 结尾：还有更多则给出完整列表入口 -->
              <div class="moments-end-tip" th:if="${not #lists.isEmpty(moments.items)}">
                <span class="end-line"></span>
                <a class="end-more" th:if="${moments.total > #lists.size(moments.items)}" th:href="@{/moments}">
                  <span th:text="'查看全部 ' + ${moments.total} + ' 条笔记'">查看全部</span>
                  <i class="czs-angle-right-l"></i>
                </a>
                <span class="end-text" th:unless="${moments.total > #lists.size(moments.items)}">已全部加载</span>
                <span class="end-line"></span>
              </div>
            </th:block>
          </th:block>

          <!-- ===== 内容区：文章首页模式（默认） ===== -->
          <th:block th:unless="${homepageMode == 'moments'}">
            <div class="article-list" id="articleList">
              <th:block th:if="${hasPosts}" th:each="post : ${posts.items}">
                <div th:replace="includes/widgets/noteCard :: noteCard(
                  type='post',
                  title=${post.spec.title},
                  excerpt=${post.status.excerpt},
                  date=${post.spec.publishTime},
                  cover=${post.spec.cover},
                  permalink=${post.status.permalink},
                  comments=${post.stats.comment},
                  defaultCover=${defaultCover}
                )"></div>
              </th:block>
              <div id="emptyState" class="empty-state" th:unless="${hasPosts}" style="display: none;">
                <p>暂无内容</p>
              </div>
              <div id="momentsContainer"></div>
            </div>
            <!-- 分页 -->
            <div th:replace="includes/components/pagination :: simple-pagination(
                   page=${posts.page},
                   totalPages=${posts.totalPages},
                   baseUrl=@{/}
                 )"></div>
          </th:block>

        </main>
        <aside class="notes-aside"
          th:style="${theme.config.layout.right_sidebar_toggle == 'hide' ? 'display:none' : ''}">
          <div class="heatmap-box">
            <div th:replace="includes/widgets/heatmap :: heatmap(momentTags=${momentTags}, momentsForHeatmap=${momentsForHeatmap})"></div>
          </div>
          <div class="topic-box" th:if="${homepageMode == 'moments'}">
            <div th:replace="includes/widgets/topicList :: moment-tags(${momentTags}, ${moments})"></div>
          </div>
          <div class="topic-box" th:unless="${homepageMode == 'moments'}">
            <div th:replace="includes/widgets/topicList :: post-tags"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>
  <!-- 页脚部分 -->
  <div th:replace="includes/components/footer :: footer"></div>
  <!-- Tab 栏配套弹窗（瞬间插件未安装提示），改由公共片段统一输出 -->
  <div th:replace="~{includes/components/contentTabs :: content-tabs-notices}"></div>

  <!-- 全局弹窗（灯箱 / 视频 / 确认框，公共片段） -->
  <div th:replace="~{includes/scripts/moment-overlays :: moment-overlays}"></div>

  <!-- 瞬间交互脚本（首页笔记流 / 列表页 / 详情页共用片段） -->
  <div th:replace="~{includes/scripts/moment-scripts :: moment-scripts}"></div>

</body>

</html>
