<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈丨[[${site.title}]]</title>
    <!-- 主题防闪烁初始化（必须在最前面） -->
    <th:block th:replace="~{includes/head/theme-init :: theme-init}"></th:block>
    <link rel="stylesheet" th:href="@{/assets/vendor/normalize.css}" />
    <link rel="stylesheet" th:href="@{/assets/dist/css/main.css}" />
    <!-- 主题配色方案 -->
    <th:block th:replace="~{includes/color-scheme :: color-scheme}"></th:block>
    <link rel="stylesheet" th:href="@{/assets/fonts/caomei/style.css}">
    <script th:src="@{/assets/vendor/dayjs.min.js}"></script>
    <script th:src="@{/assets/vendor/relativeTime.js}"></script>
    <script th:src="@{/assets/vendor/zh-cn.js}"></script>
    <!-- 打开搜索弹窗 -->
    <script>
        if (window.location.hash === '#open-search') {
            setTimeout(() => {
                if (window.SearchWidget) SearchWidget.open('');
            }, 100);
        }
    </script>
    <!-- Header 滚动隐藏脚本 -->
    <script>
    </script>
    <script th:src="@{/assets/dist/js/main.js}"></script>
</head>

<body>
    <!-- 插入头部组件 -->
    <div th:replace="includes/components/header :: header"></div>
    <!-- 页面主体容器 -->
    <div class="container"
        th:with="allPosts=${postFinder.listAll()}, stats=${siteStatsFinder.getStats()}, momentsForHeatmap=${momentFinder != null ? momentFinder.list(1, 100) : null}">
        <!-- 左侧：窄栏（菜单 + 小组件） -->
        <aside class="sidebar" th:style="${theme.config.layout.sidebar_toggle == 'hide' ? 'display:none' : ''}">
            <!-- nav -->
            <div th:replace="includes/components/nav :: nav"></div>
            <!-- author card -->
            <div th:replace="includes/widgets/authorCard :: authorCard(postCount=${allPosts.size()}, stats=${stats})">
            </div>
        </aside>
        <!-- 右侧：主内容大盒子 -->
        <div class="content">
            <main class="friends"
                th:with="beforePublishedAt=${#strings.isEmpty(#strings.toString(param.beforePublishedAt)) ? null : #strings.toString(param.beforePublishedAt)}, beforeId=${#strings.isEmpty(#strings.toString(param.beforeId)) ? null : #strings.toString(param.beforeId)}, linkFeeds=${linkFeedFinder != null ? (beforePublishedAt != null and beforeId != null ? linkFeedFinder.list({limit: 20, beforePublishedAt: beforePublishedAt, beforeId: beforeId}) : linkFeedFinder.list({limit: 20})) : null}">
                <div class="page-header">
                    <h1 class="page-title">朋友圈</h1>
                    <p class="page-description">关注博主的友链更新</p>
                </div>
                <!-- 插件未安装提示 -->
                <div class="plugin-notice" th:if="${linkFeedFinder == null}">
                    <div class="plugin-notice-icon">🌐</div>
                    <div class="plugin-notice-content">
                        <h3>链接管理插件未安装</h3>
                        <p>请安装 <a href="https://www.halo.run/store/apps/app-hfbQg" target="_blank">官方链接管理插件</a> 并开启 RSS 订阅功能</p>
                    </div>
                </div>
                <!-- 朋友圈列表 -->
                <th:block th:if="${linkFeedFinder != null and (linkFeeds == null or #lists.isEmpty(linkFeeds.items))}">
                    <div class="empty-state">
                        <p>暂无朋友圈动态</p>
                        <p class="empty-hint">请确保已在链接管理插件设置中开启「公开 RSS 订阅动态」，并为友链配置 RSS/Atom 地址</p>
                    </div>
                </th:block>
                <!-- 朋友圈内容 -->
                <th:block th:unless="${linkFeeds == null or #lists.isEmpty(linkFeeds.items)}" th:each="friend : ${linkFeeds.items}">
                    <div class="friend-card">
                        <div class="friend-header">
                            <img class="friend-avatar" th:src="${friend.authorLogo}" th:alt="${friend.author}"
                                onerror="this.src=@{/assets/images/author-avatar.png}" />
                            <div class="friend-info">
                                <a class="friend-author" th:href="${friend.authorUrl}" target="_blank"
                                    th:text="${friend.author}">作者</a>
                                <span class="friend-date" th:if="${friend.publishedAt != null}"
                                    th:data-date="${friend.publishedAt}">[[${friend.publishedAt}]]</span>
                            </div>
                        </div>
                        <a class="friend-content" th:href="${friend.url}" target="_blank">
                            <h3 class="friend-title" th:text="${friend.title}">文章标题</h3>
                            <p class="friend-desc" th:text="${friend.summary}">文章描述</p>
                        </a>
                    </div>
                </th:block>
                <!-- 游标分页 -->
                <div class="pagination" th:if="${linkFeeds != null and linkFeeds.nextBeforePublishedAt != null and linkFeeds.nextBeforeId != null}" style="justify-content: center;">
                    <a th:href="@{/friends(beforePublishedAt=${linkFeeds.nextBeforePublishedAt}, beforeId=${linkFeeds.nextBeforeId})}"
                        class="pagination-next">
                        加载更多
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"
                            style="width:1em;height:1em;flex-shrink:0">
                            <path fill-rule="evenodd"
                                d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z"
                                clip-rule="evenodd" />
                        </svg>
                    </a>
                </div>
                <!-- 评论区 -->
                <div class="post-comment-section" th:if="${singlePage != null}">
                    <div th:replace="~{includes/comment/comment :: comment}"></div>
                </div>
            </main>
        </div>
    </div>
    <!-- 页脚部分 -->
    <div th:replace="includes/components/footer :: footer"></div>
    <script>
        (function () {
            var path = window.location.pathname;
            var tabs = document.querySelectorAll('.notes-tabbar .tab-item');
            tabs.forEach(function (tab) {
                var link = tab.querySelector('a');
                if (!link) return;
                var href = link.getAttribute('href');
                if (!href) return;

                // 首页
                if (path === '/' || path === '' || path === '/index' || path === '/index.html') {
                    if (href === '/' || href.endsWith('/')) {
                        tab.classList.add('active');
                    }
                }
                // 朋友圈页面
                else if (path.startsWith('/friends')) {
                    if (href === '/friends') {
                        tab.classList.add('active');
                    }
                }
            });
        })();
    </script>
</body>

</html>
